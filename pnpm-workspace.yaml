packages:
  - 'apps/*'
  - 'packages/*'
  - 'workers'
  # apps/server is self-hosted Node.js + Hono backend, not a Cloudflare Worker.

allowBuilds:
  esbuild: true
  workerd: true
  # reka-ui -> @floating-ui/vue -> vue-demi has a postinstall script.
  # Without this, `shadcn-vue init` fails with ERR_PNPM_IGNORED_BUILDS.
  vue-demi: true
  better-sqlite3: true

minimumReleaseAgeExclude:
  - miniflare@5.20260923.0-alpha
  - wrangler@4.139.0
  - vite@8.3.1
