[package]
name = "ponter_desktop"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "ponter_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1.0.104"
keyring = { version = "4.2.0", features = ["apple-native-keyring-store"] }
ponter-agent = { path = "../../agent" }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
ring = "0.17.14"
tauri-plugin-updater = "2"
semver = "1"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
# The agent vendors xcap 0.9.8 with a Wayland lifetime fix (see
# ../../agent/vendor/xcap/PATCH.md). Cargo reads [patch] only from the root
# manifest, so the desktop build must repeat it or it silently links the
# unpatched registry crate.
[patch.crates-io]
xcap = { path = "../../agent/vendor/xcap" }

[target.'cfg(all(not(target_env = "musl"), target_os = "windows"))'.dependencies]
xcap = { version = "0.9.8", features = ["wgc"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
