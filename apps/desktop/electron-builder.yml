appId: com.ponter.desktop
# `productName` is global (electron-builder has no per-platform override), so it
# drives both the Linux install directory and the Windows installer naming.
# Linux install dir = /opt/${sanitizeFileName(productName)} => /opt/ponterdesktop.
# The Windows UX is preserved explicitly via the `nsis.shortcutName` /
# `nsis.uninstallDisplayName` overrides below.
productName: ponterdesktop
directories:
  output: dist
  buildResources: build
files:
  - out/**/*
  - package.json
extraResources:
  - from: resources
    to: .
linux:
  target:
    - target: AppImage
    - target: deb
    - target: rpm
  category: Utility
  icon: icons/icon.png
  # Only the Linux executable is renamed. Never set a top-level `executableName`
  # — that would also rename the Windows binary. The packaged app name
  # (`app.getName()` / userData dir) is unaffected: it comes from the asar's
  # package.json (`@ponter/desktop`), which electron-builder does not rewrite.
  executableName: ponter
  desktop:
    # Keep the friendly menu label even though `productName` is now the
    # space-free `ponterdesktop` (computeDesktopEntry spreads this last).
    Name: Ponter Desktop
# The workspace package name is scoped (`@ponter/desktop`), and electron-builder
# expands the `${name}` macro in the deb/rpm default filename patterns
# (`${name}_${version}_${arch}.${ext}`) to that raw name — the `/` is then treated
# as a path separator, so fpm tries to write into a non-existent `dist/@ponter/`
# directory. Override the artifact name with the sanitized `${productName}` so the
# installers land directly in `dist/`. AppImage/NSIS already default to
# `${productName}` and are unaffected.
deb:
  # `packageName` must be a single token — the correct Debian package identifier.
  # (Kept explicit even though `productName` is now space-free, so the .deb name
  # stays stable and independent of the display name.)
  packageName: ponter-desktop
  artifactName: ${productName}_${version}_${arch}.${ext}
rpm:
  packageName: ponter-desktop
  artifactName: ${productName}-${version}.${arch}.${ext}
  afterRemove: build/after-remove.sh
win:
  target:
    - target: nsis
    - target: portable
  icon: icons/icon.ico
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  # `productName` is global and now the space-free `ponterdesktop`; restore the
  # friendly Windows UX (Start Menu shortcut + Apps & features entry) here so the
  # Linux-driven rename does not regress Windows.
  shortcutName: Ponter Desktop
  uninstallDisplayName: Ponter Desktop ${version}
  # Explicit, deterministic name so the CI upload step can distinguish the NSIS
  # installer from the portable build (both are `.exe`).
  artifactName: ${productName}-Setup-${version}.${ext}
portable:
  # Explicit, deterministic name — see the `nsis` note above.
  artifactName: ${productName}-Portable-${version}.${ext}
publish:
  provider: github
  owner: ngotuananh101
  repo: ponter
