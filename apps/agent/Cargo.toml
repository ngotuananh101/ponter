[package]
name = "ponter-agent"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"          # clap 4.6.7's MSRV is the highest in the set (spec R24)

# The agent is a library plus a thin CLI (ADR-50): the runtime lives in the
# `ponter_agent` lib so the Tauri desktop backend can embed it in-process, and
# `main.rs` is the unchanged-behaviour CLI over `AgentRuntime`.
[lib]
name = "ponter_agent"
path = "src/lib.rs"

[[bin]]
name = "ponter-agent"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.89"
base64 = "0.23"
bytes = "1"
clap = { version = "4.6.7", features = ["derive", "env"] }
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
portable-pty = "0.9"
ring = "0.17.14"
# `rtc` is a direct dependency because webrtc 0.21 does not re-export the parts
# of it the agent needs: `rtc::ice::mdns::MulticastDnsMode` for the setting
# engine, and `rtc::peer_connection::...` types in tests. Version-pinned to the
# same 0.21 line webrtc depends on so the two resolve to one crate.
rtc = "0.21"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
webrtc = "0.21"

# `log` is already in the tree (webrtc and its `rtc-*` crates log through it,
# and `tracing-log` bridges it into `tracing`). It is a dev-dependency here so
# `logging`'s tests can assert the filter works on that bridged path, not only
# on `tracing`'s own macros.
[dev-dependencies]
log = "0.4"
tracing-log = "0.2"

# Desktop streaming. Absent on musl: that target is the fully-static
# terminal-only artifact, and desktop offers are refused there (ADR-15).
# openh264 is gated too, not just xcap: openh264-sys2 compiles vendored C++
# via cc, and cc-rs cannot find a C++ compiler for the musl target
# (musl-tools ships musl-gcc only — verified by probe).
[target.'cfg(not(target_env = "musl"))'.dependencies]
# Input injection (ADR-27 finding: enigo, MIT). Non-musl: the musl artifact is
# terminal-only and never injects. Enigo is pure Rust (no vendoring, unlike
# xcap) and in fact builds on musl too — the cfg-gate here is policy, not a
# build constraint. The concrete injector lives in `input::platform`, gated the
# same way.
enigo = "0.6.1"
openh264 = "0.9.8"     # vendored Cisco source; no network at build time
# `openh264` re-exports only `OpenH264API`, so the raw-API constants
# (`ENCODER_OPTION_BITRATE`/`ENCODER_OPTION_MAX_BITRATE`) and `SBitrateInfo`
# that `DesktopEncoder::apply_bitrate` needs live only here. Same version line
# so the two crates resolve to one `openh264-sys2`.
openh264-sys2 = "0.9.8"
xcap = "0.9.8"
x11rb = { version = "0.13", features = ["xfixes"] }
image = { version = "0.25", default-features = false, features = ["png"] }

# On Windows, use xcap's Windows.Graphics.Capture backend instead of DXGI
# Output Duplication. DXGI's `DuplicateOutput` fails with E_INVALIDARG
# (0x80070057) on hybrid-GPU laptops: xcap creates its ID3D11Device on the
# default adapter and never matches it to the adapter that owns the monitor's
# output, so `video_recorder()` fails and the agent refuses the desktop offer
# with "screen capture unavailable: opening the video recorder" (upstream
# nashaofu/xcap#264). WGC captures per monitor through a GraphicsCaptureItem
# and has no such adapter constraint. Windows-only: the feature pulls in
# Windows-only dependencies, and on Linux/macOS the default backend is used.
[target.'cfg(all(not(target_env = "musl"), target_os = "windows"))'.dependencies]
xcap = { version = "0.9.8", features = ["wgc"] }
# Direct Windows API access for DPI awareness (Task 1) and GDI fallback
# (Task 2). Only linked on Windows; on Linux/macOS these code paths are
# cfg-gated out.
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
] }

# `xcap` 0.9.8 drops the portal ScreenCast session at the end of
# `WaylandVideoRecorder::new()`, which tears the session down before PipeWire
# ever attaches — the Wayland capture then delivers zero frames (black stream).
# Vendored with a lifetime fix; see `vendor/xcap/PATCH.md`. Remove this once a
# release carries the fix upstream.
[patch.crates-io]
xcap = { path = "vendor/xcap" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev.package."*"]
opt-level = 2

