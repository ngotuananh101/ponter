[package]
name = "ponter-agent"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"          # clap 4.6.7's MSRV is the highest in the set (spec R24)

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.89"
base64 = "0.23"
clap = { version = "4.6.7", features = ["derive", "env"] }
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
portable-pty = "0.9"
# `rtc` is a direct dependency because webrtc 0.21 does not re-export the parts
# of it the agent needs: `rtc::ice::mdns::MulticastDnsMode` for the setting
# engine, and `rtc::peer_connection::...` types in tests. Version-pinned to the
# same 0.21 line webrtc depends on so the two resolve to one crate.
rtc = "0.21"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
webrtc = "0.21"

# Desktop streaming. Absent on musl: that target is the fully-static
# terminal-only artifact, and desktop offers are refused there (ADR-15).
# openh264 is gated too, not just xcap: openh264-sys2 compiles vendored C++
# via cc, and cc-rs cannot find a C++ compiler for the musl target
# (musl-tools ships musl-gcc only — verified by probe).
[target.'cfg(not(target_env = "musl"))'.dependencies]
bytes = "1"
openh264 = "0.9.8"     # vendored Cisco source; no network at build time
xcap = "0.9.8"

# `xcap` 0.9.8 drops the portal ScreenCast session at the end of
# `WaylandVideoRecorder::new()`, which tears the session down before PipeWire
# ever attaches — the Wayland capture then delivers zero frames (black stream).
# Vendored with a lifetime fix; see `vendor/xcap/PATCH.md`. Remove this once a
# release carries the fix upstream.
[patch.crates-io]
xcap = { path = "vendor/xcap" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

