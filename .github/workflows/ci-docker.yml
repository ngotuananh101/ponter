name: CI (Docker)

# Build verification for the unified all-in-one container image.
# Covers backend (@ponter/server), frontend SPA (@ponter/web), and Nginx reverse proxy.

on:
  push:
    branches: [main, develop]
    paths:
      - 'docker/**'
      - 'apps/server/**'
      - 'apps/web/**'
      - 'packages/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig.base.json'
      - '.github/workflows/ci-docker.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'docker/**'
      - 'apps/server/**'
      - 'apps/web/**'
      - 'packages/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig.base.json'
      - '.github/workflows/ci-docker.yml'

jobs:
  docker:
    name: Docker Build Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Build all-in-one Docker image
        run: docker build -f docker/Dockerfile -t ponter:ci .

      - name: Verify image exists
        run: docker image inspect ponter:ci

      - name: Smoke-test all-in-one container (health, spa, config, api proxy)
        run: |
          docker run -d --name ponter-smoke -p 8080:8080 \
            -e JWT_SECRET="smoke-jwt-secret-at-least-32-characters-long" \
            -e REFRESH_TOKEN_SECRET="smoke-refresh-secret-at-least-32-characters" \
            -e CORS_ORIGIN="http://localhost:8080" \
            ponter:ci

          # Poll /health for up to ~30s
          healthy=false
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/health >/dev/null 2>&1; then
              echo "container healthy after ${i}s"
              healthy=true
              break
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' ponter-smoke)" != "true" ]; then
              echo "::error::container exited prematurely"
              docker logs ponter-smoke
              exit 1
            fi
            sleep 1
          done

          if [ "$healthy" != "true" ]; then
            echo "::error::container did not become healthy within 30s"
            docker logs ponter-smoke
            exit 1
          fi

          echo "Verifying SPA root page..."
          curl -fsS http://localhost:8080/ | grep -q '<div id="app"></div>'

          echo "Verifying runtime config injection..."
          curl -fsS http://localhost:8080/config.js | grep -q 'window.__PONTER_CONFIG__'

          echo "Verifying API proxy route..."
          status=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/api/users/me)
          if [ "$status" != "401" ]; then
            echo "::error::expected 401 from /api/users/me proxy, got $status"
            exit 1
          fi

          echo "All smoke tests passed successfully."

      - name: Container logs on failure
        if: always()
        run: docker logs ponter-smoke || true
