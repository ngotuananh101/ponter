name: CI (Docker)

# Build verification for the self-hosted server image. Split out of the old
# monolithic `ci.yml` so it only runs when the image's inputs change.
#
# The path filter mirrors exactly what `docker/Dockerfile.server` COPYs from
# the build context (repo root): the workspace manifests, every `packages/*`,
# `apps/server`, and `docker/`. It intentionally omits `turbo.json`, the
# eslint/prettier configs, and the agent/web apps — the Dockerfile never reads
# them, so touching them cannot change the image.

on:
  push:
    branches: [main, develop]
    paths:
      - 'docker/**'
      - 'apps/server/**'
      - 'packages/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig.base.json'
      - '.github/workflows/ci-docker.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'docker/**'
      - 'apps/server/**'
      - 'packages/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig.base.json'
      - '.github/workflows/ci-docker.yml'

jobs:
  docker:
    name: Docker Build Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Build server Docker image
        run: docker build -f docker/Dockerfile.server -t ponter-server:ci .

      - name: Verify image exists
        run: docker image inspect ponter-server:ci

      - name: Smoke-test the image (server must boot and answer /health)
        run: |
          docker run -d --name ponter-smoke -p 8787:8787 \
            -e JWT_SECRET="smoke-jwt-secret-at-least-32-characters-long" \
            -e REFRESH_TOKEN_SECRET="smoke-refresh-secret-at-least-32-characters" \
            -e CORS_ORIGIN="http://localhost:5173" \
            ponter-server:ci
          # Poll /health for up to ~30s. A non-booting image (e.g. an
          # ERR_MODULE_NOT_FOUND at startup) exits and curl never succeeds.
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8787/health >/dev/null 2>&1; then
              echo "server healthy after ${i}s"
              curl -fsS http://localhost:8787/health
              exit 0
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' ponter-smoke)" != "true" ]; then
              echo "::error::container exited before becoming healthy"
              exit 1
            fi
            sleep 1
          done
          echo "::error::server did not become healthy within 30s"
          exit 1

      - name: Container logs on failure
        if: always()
        run: docker logs ponter-smoke || true
