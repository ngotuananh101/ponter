name: Build Desktop

# Cross-platform build + bundle + release workflow for the `ponter-desktop`
# native Rust shell at `apps/desktop`. ADR-79.
#
# - Tag push (v*.*.* / desktop-v*.*.*): builds every supported platform, produces native
#   installers (.deb + .AppImage / .msi + .exe), uploads them as
#   artifacts, and attaches them to a GitHub Release.
# - workflow_dispatch: identical, plus `dry_run` to build without releasing.
# - Pull requests and branch pushes to main/develop: builds every supported platform,
#   uploads installer artifacts (no release is created).
# - Path filter: `apps/desktop/**`, `apps/agent/**`, and this workflow file so
#   dependency bumps elsewhere don't trigger the 2-OS matrix.

on:
  push:
    tags:
      - 'v*.*.*'
      - 'desktop-v*.*.*'
    branches:
      - main
      - develop
    paths:
      - 'apps/desktop/**'
      - '!apps/desktop/**/*.md'
      - 'apps/agent/**'
      - '.github/workflows/build-desktop.yml'
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'apps/desktop/**'
      - '!apps/desktop/**/*.md'
      - 'apps/agent/**'
      - '.github/workflows/build-desktop.yml'
  workflow_dispatch:
    inputs:
      version:
        description: 'Semantic version to release (e.g. 0.1.0)'
        required: false
        type: string
      prerelease:
        description: 'Optional prerelease suffix (e.g. beta.1); leave empty for a stable release'
        type: string
        default: ''
      dry_run:
        description: 'Build and bundle but skip the GitHub Release (for testing the workflow)'
        type: boolean
        default: false

# One in-flight run per ref so a re-triggered release cancels the prior one
# rather than racing on the same tag.
concurrency:
  group: build-desktop-${{ github.ref }}
  cancel-in-progress: true

env:
  WORKSPACE: apps/desktop

jobs:
  # ---------------------------------------------------------------------------
  # Build + bundle matrix across Linux / Windows.
  # ---------------------------------------------------------------------------
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    defaults:
      run:
        working-directory: ${{ env.WORKSPACE }}
        shell: bash
    # ADR-67: the default server URL is baked into the binary at COMPILE time via
    # `option_env!("PONTER_DEFAULT_SERVER_URL")` (apps/desktop/src/core/state.rs).
    # The installers are packaged from that already-built binary
    # (`cargo deb --no-build` / `cargo generate-rpm` / `scripts/make-appimage.sh`),
    # so the variable must be set on the BUILD step — setting it only on Test
    # made the repo variable a no-op for the shipped artifacts. Job-level `env`
    # covers every compile step (Build and Test) from a single source of truth.
    env:
      PONTER_DEFAULT_SERVER_URL: ${{ vars.PONTER_DEFAULT_SERVER_URL || '' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        include:
          - os: ubuntu-latest
            runner: ubuntu-latest
          - os: windows-latest
            runner: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: '1.98.1'

      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config libssl-dev libclang-dev \
            libxcb1-dev libxcb-randr0-dev libxcb-shm0-dev libxcb-xfixes0-dev \
            libxrandr-dev libxkbcommon-dev libx11-dev libgl1-mesa-dev \
            libwayland-dev libegl-dev libgbm-dev libdrm-dev \
            libpipewire-0.3-dev libspa-0.2-dev

      - name: Install appimagetool
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          curl --proto "=https" --tlsv1.2 -sSfL -o /tmp/appimagetool.AppImage https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x /tmp/appimagetool.AppImage
          (cd /tmp && ./appimagetool.AppImage --appimage-extract >/dev/null)
          sudo mv /tmp/squashfs-root /opt/appimagetool
          sudo ln -s /opt/appimagetool/AppRun /usr/local/bin/appimagetool

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: ${{ env.WORKSPACE }} -> ${{ env.WORKSPACE }}/target

      - name: Guard — no webview/GTK/Qt in the dependency graph
        working-directory: apps/desktop
        shell: bash
        run: |
          set -euo pipefail
          if cargo tree --locked | grep -Ei '\b(webkit|gtk|qt|wry|tao)\b'; then
            echo "::error::a webview/GTK/Qt crate is in the dependency graph"
            exit 1
          fi
          echo "no webview/GTK/Qt crate present"

      - name: Build
        working-directory: apps/desktop
        run: cargo build --release --locked

      - name: Test
        working-directory: apps/desktop
        env:
          PONTER_KEYCHAIN_SKIP: 1
        run: cargo test --locked

      - name: Package (Linux)
        if: matrix.os == 'ubuntu-latest'
        working-directory: apps/desktop
        run: |
          cargo install cargo-deb cargo-generate-rpm --locked
          cargo deb --no-build
          cp target/debian/*.deb target/release/ 2>/dev/null || true
          cargo generate-rpm
          cp target/generate-rpm/*.rpm target/release/ 2>/dev/null || true
          ./scripts/make-appimage.sh

      - name: Set up Windows packaging tools
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $nsisPaths = @("C:\Program Files (x86)\NSIS", "C:\Program Files\NSIS")
          $nsisFound = $false
          foreach ($p in $nsisPaths) {
            if (Test-Path "$p\makensis.exe") {
              Write-Host "Found NSIS at $p"
              $p | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
              $nsisFound = $true
              break
            }
          }
          if (-not $nsisFound) {
            Write-Host "Installing NSIS via chocolatey..."
            choco install nsis -y --no-progress
            "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }

          $wixPaths = @(
            "C:\Program Files (x86)\WiX Toolset v3.14\bin",
            "C:\Program Files (x86)\WiX Toolset v3.11\bin",
            "C:\Program Files (x86)\WiX Toolset\bin",
            "C:\Program Files\WiX Toolset\bin"
          )
          foreach ($wp in $wixPaths) {
            if (Test-Path "$wp\candle.exe") {
              Write-Host "Found WiX at $wp"
              $wp | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
              break
            }
          }

      - name: Package (Windows)
        if: matrix.os == 'windows-latest'
        working-directory: apps/desktop
        shell: bash
        run: |
          for p in "/c/Program Files (x86)/NSIS" "/c/Program Files/NSIS" "/c/Program Files (x86)/WiX Toolset v3.14/bin" "/c/Program Files (x86)/WiX Toolset v3.11/bin"; do
            if [ -d "$p" ]; then export PATH="$p:$PATH"; fi
          done
          cargo install cargo-wix --locked
          mkdir -p target/release/bundle/nsis target/release/bundle/msi
          makensis installer.nsi
          cargo wix --no-build --nocapture -L -sice:ICE38 -L -sice:ICE64 -L -sice:ICE91
          cp target/wix/*.msi target/release/bundle/msi/ 2>/dev/null || true

      - name: Upload Linux deb artifact
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: ponter-desktop-linux-deb
          path: ${{ env.WORKSPACE }}/target/release/*.deb
          if-no-files-found: error
          retention-days: 7

      - name: Upload Linux rpm artifact
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: ponter-desktop-linux-rpm
          path: ${{ env.WORKSPACE }}/target/release/*.rpm
          if-no-files-found: error
          retention-days: 7

      - name: Upload Linux AppImage artifact
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: ponter-desktop-linux-appimage
          path: ${{ env.WORKSPACE }}/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
          retention-days: 7

      - name: Upload Windows msi artifact
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: ponter-desktop-windows-msi
          path: ${{ env.WORKSPACE }}/target/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 7

      - name: Upload Windows NSIS artifact
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: ponter-desktop-windows-nsis
          path: ${{ env.WORKSPACE }}/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 7

      - name: Upload Windows portable artifact
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: ponter-desktop-windows-portable
          path: ${{ env.WORKSPACE }}/target/release/ponter-desktop.exe
          if-no-files-found: error
          retention-days: 7

      - name: Assert installer artifacts (Linux)
        if: matrix.os == 'ubuntu-latest'
        working-directory: apps/desktop
        run: |
          set -e
          echo "Target release contents:"
          ls -la target/release/
          find target/release -maxdepth 1 -name '*.deb' | grep -q . || { echo "::error::No .deb found"; exit 1; }
          find target/release -maxdepth 1 -name '*.rpm' | grep -q . || { echo "::error::No .rpm found"; exit 1; }
          find target/release/bundle/appimage -name '*.AppImage' | grep -q . || { echo "::error::No .AppImage found"; exit 1; }
          for f in target/release/*.deb target/release/*.rpm target/release/bundle/appimage/*.AppImage; do
            sz=$(wc -c < "$f")
            echo "  $f ($sz bytes)"
            if [ "$sz" -lt 10240 ]; then
              echo "::error::File $f is smaller than 10 KB ($sz bytes)"
              exit 1
            fi
          done
          echo "Installer artifact check PASSED (Linux)."

      - name: Assert installer artifacts (Windows)
        if: matrix.os == 'windows-latest'
        working-directory: apps/desktop
        shell: pwsh
        run: |
          $bundle = "target\release\bundle"
          Write-Host "Bundle dir contents:"
          Get-ChildItem -Recurse -File $bundle | Format-Table FullName, Length
          $msi = Get-ChildItem -Recurse -File "target\release\bundle\msi" | Where-Object { $_.Extension -eq '.msi' -and $_.Length -ge 10240 }
          $nsis = Get-ChildItem -Recurse -File "target\release\bundle\nsis" | Where-Object { $_.Extension -eq '.exe' -and $_.Length -ge 10240 }
          $portable = Get-Item "target\release\ponter-desktop.exe"
          if (-not $msi) { throw "No valid .msi found in bundle/msi" }
          if (-not $nsis) { throw "No valid .exe found in bundle/nsis" }
          if (-not $portable -or $portable.Length -lt 10240) { throw "No valid ponter-desktop.exe found in target/release" }
          Write-Host "Installer artifact check PASSED (Windows)."

  # ---------------------------------------------------------------------------
  # Publish a GitHub Release with all platform installer artifacts.
  # Runs only on tag push or a non-dry-run manual dispatch.
  # ---------------------------------------------------------------------------
  release:
    name: Create GitHub Release
    needs: build
    if: |
      startsWith(github.ref, 'refs/tags/') ||
      (github.event_name == 'workflow_dispatch' && inputs.dry_run == false)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'

      - name: Download all build artifacts
        uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806 # v4.1.9
        with:
          path: dist
          merge-multiple: true

      - name: Assert release installer assets exist
        shell: bash
        run: |
          set -e
          echo "Installer files present under dist/:"
          find dist -type f \( -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' \
            -o -name '*.msi' -o -name '*.exe' \) -print || true
          count=$(find dist -type f \( -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' \
            -o -name '*.msi' -o -name '*.exe' \) | wc -l)
          echo "Installer files found: $count"
          if [ "$count" -lt 1 ]; then
            echo "::error::No installer files found under dist/ — the release would be empty"
            exit 1
          fi

      - name: Sign release assets with minisign
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY || secrets.TAURI_SIGNING_PRIVATE_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD || secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        shell: bash
        run: |
          if [ -z "$MINISIGN_SECRET_KEY" ]; then
            echo "No minisign secret key provided, skipping signature generation."
            exit 0
          fi
          sudo apt-get update && sudo apt-get install -y minisign
          KEYFILE=$(mktemp)
          echo "$MINISIGN_SECRET_KEY" > "$KEYFILE"
          find dist -type f \( -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' -o -name '*.msi' -o -name '*.exe' \) ! -name 'ponter-desktop.exe' | while read -r f; do
            echo "Signing $f..."
            if [ -n "$MINISIGN_PASSWORD" ]; then
              echo "$MINISIGN_PASSWORD" | minisign -s "$KEYFILE" -S -m "$f" -x "$f.sig"
            else
              minisign -s "$KEYFILE" -S -m "$f" -x "$f.sig"
            fi
          done
          rm -f "$KEYFILE"

      - name: Generate consolidated checksums manifest
        shell: bash
        run: |
          find dist -type f -name '*.sha256' -exec cat {} + > dist/SHA256SUMS.txt 2>/dev/null || true
          echo "Consolidated checksums:"
          cat dist/SHA256SUMS.txt 2>/dev/null || echo "(no checksum files)"
          echo "Release assets:"
          find dist -type f | sort

      - name: Set version and prerelease flag
        id: meta
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
          PRERELEASE_INPUT: ${{ inputs.prerelease }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            raw="$INPUT_VERSION"
          else
            raw="$REF_NAME"
          fi
          version="${raw#v}"
          version="${version#desktop-v}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

          IS_PRERELEASE="false"
          if [[ "${raw}" == *-* ]] || [ -n "${PRERELEASE_INPUT}" ]; then
            IS_PRERELEASE="true"
          fi
          echo "prerelease=${IS_PRERELEASE}" >> "$GITHUB_OUTPUT"

      - name: Assemble latest.json manifest (ADR-57, ADR-80)
        shell: bash
        run: |
          set -e
          cd dist
          raw="${{ github.ref_name }}"
          version="${raw#v}"
          version="${version#desktop-v}"
          GH="https://github.com/${GITHUB_REPOSITORY}/releases/download/${raw}"
          GH="$GH" VERSION="$version" node <<'NODE'
          const fs = require("fs");
          const GH = process.env.GH;
          const version = process.env.VERSION;
          // Map installer file -> target key {os}-{arch}-{bundle_type}.
          const targetFor = (f) => {
            // Windows portable binary — ponter-desktop.exe
            if (/^ponter-desktop\.exe$/i.test(f)) return null;
            if (/\.AppImage$/.test(f)) return { os: "linux", arch: "x86_64", bundle: "appimage" };
            if (/\.deb$/.test(f)) return { os: "linux", arch: "x86_64", bundle: "deb" };
            if (/\.rpm$/.test(f)) return { os: "linux", arch: "x86_64", bundle: "rpm" };
            if (/\.msi$/.test(f)) return { os: "windows", arch: "x86_64", bundle: "msi" };
            if (/\.exe$/.test(f)) return { os: "windows", arch: "x86_64", bundle: "nsis" };
            return null;
          };
          const path = require("path");
          const walk = (dir) =>
            fs.readdirSync(dir, { withFileTypes: true }).flatMap((e) => {
              const p = path.join(dir, e.name);
              return e.isDirectory() ? walk(p) : [p];
            });
          const platforms = {};
          for (const fp of walk(".")) {
            const f = path.basename(fp);
            const t = targetFor(f);
            if (!t) continue;
            const sigFile = fp + ".sig";
            if (!fs.existsSync(sigFile)) continue;
            const sig = fs.readFileSync(sigFile, "utf8").trim();
            const key = `${t.os}-${t.arch}-${t.bundle}`;
            if (!platforms[key]) {
              platforms[key] = { url: GH + "/" + f, signature: sig };
            }
          }
          if (Object.keys(platforms).length === 0) {
            console.error("no platforms resolved from dist/");
            process.exit(1);
          }
          const manifest = { version, notes: null, pub_date: new Date().toISOString(), platforms };
          fs.writeFileSync("latest.json", JSON.stringify(manifest));
          console.log("latest.json:\n" + JSON.stringify(manifest, null, 2));
          NODE
          echo
          echo "Assembled latest.json with per-platform signatures (no top-level sig)."

      - name: Create GitHub Release
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda # v2.2.1
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', steps.meta.outputs.version) }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('Ponter Desktop v{0}', steps.meta.outputs.version) }}
          files: |
            dist/**/*.deb
            dist/**/*.rpm
            dist/**/*.AppImage
            dist/**/*.msi
            dist/**/*.exe
            dist/**/*.sha256
            dist/SHA256SUMS.txt
            dist/latest.json
          prerelease: ${{ steps.meta.outputs.prerelease == 'true' }}
          generate_release_notes: true
