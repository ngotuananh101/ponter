name: Build Desktop

# Cross-platform build + bundle + release workflow for the `ponter-desktop`
# Electron shell at `apps/desktop`. The Electron main process supervises a
# Rust `ponter-agent` sidecar binary (ADR-79 successor — Electron migration).
#
# - Tag push (v*.*.* / desktop-v*.*.*): builds every supported platform, produces
#   installers (.deb + .rpm + .AppImage / .exe), uploads them as artifacts,
#   and attaches them to a GitHub Release.
# - workflow_dispatch: identical, plus `dry_run` to build without releasing.
# - Pull requests and branch pushes to main/develop: builds every supported
#   platform, uploads installer artifacts (no release is created).
# - Path filter: `apps/desktop/**`, `apps/agent/**`, and this workflow file so
#   dependency bumps elsewhere don't trigger the 2-OS matrix.

on:
  push:
    tags:
      - 'v*.*.*'
      - 'desktop-v*.*.*'
    branches:
      - main
      - develop
    paths:
      - 'apps/desktop/**'
      - '!apps/desktop/**/*.md'
      - 'apps/agent/**'
      - '.github/workflows/build-desktop.yml'
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'apps/desktop/**'
      - '!apps/desktop/**/*.md'
      - 'apps/agent/**'
      - '.github/workflows/build-desktop.yml'
  workflow_dispatch:
    inputs:
      version:
        description: 'Semantic version to release (e.g. 0.1.0)'
        required: false
        type: string
      prerelease:
        description: 'Optional prerelease suffix (e.g. beta.1); leave empty for a stable release'
        type: string
        default: ''
      dry_run:
        description: 'Build and bundle but skip the GitHub Release (for testing the workflow)'
        type: boolean
        default: false

# One in-flight run per ref so a re-triggered release cancels the prior one
# rather than racing on the same tag.
concurrency:
  group: build-desktop-${{ github.ref }}
  cancel-in-progress: true

env:
  WORKSPACE: apps/desktop
  AGENT_WORKSPACE: apps/agent

jobs:
  # ---------------------------------------------------------------------------
  # Build + bundle matrix across Linux / Windows.
  # ---------------------------------------------------------------------------
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            runner: ubuntu-latest
          - os: windows-latest
            runner: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: '12.6.0'

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: '1.98.1'

      - name: Cache cargo registry and target (agent)
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: ${{ env.AGENT_WORKSPACE }} -> ${{ env.AGENT_WORKSPACE }}/target

      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config libssl-dev libclang-dev \
            libxcb1-dev libxcb-randr0-dev libxcb-shm0-dev libxcb-xfixes0-dev \
            libxrandr-dev libxkbcommon-dev libx11-dev libgl1-mesa-dev \
            libwayland-dev libegl-dev libgbm-dev libdrm-dev \
            libpipewire-0.3-dev libspa-0.2-dev rpm

      - name: Build Rust agent binary
        working-directory: ${{ env.AGENT_WORKSPACE }}
        run: cargo build --release --locked --manifest-path Cargo.toml

      - name: Copy agent binary into desktop resources
        shell: bash
        run: |
          mkdir -p apps/desktop/resources
          if [ "${{ matrix.os }}" == "ubuntu-latest" ]; then
            cp apps/agent/target/release/ponter-agent apps/desktop/resources/ponter-agent
          else
            cp apps/agent/target/release/ponter-agent.exe apps/desktop/resources/ponter-agent.exe
          fi

      - name: Verify agent binary is present
        run: |
          if [ -n "${GITHUB_RUN_ID}" ] && [ "$RUNNER_OS" = "Linux" ]; then
            ls -la apps/desktop/resources/ponter-agent
          fi
          if [ -n "${GITHUB_RUN_ID}" ] && [ "$RUNNER_OS" = "Windows" ]; then
            ls -la apps/desktop/resources/ponter-agent.exe
          fi

      - name: Setup pnpm workspace dependencies
        working-directory: apps/desktop
        run: |
          cd ../../
          pnpm install --frozen-lockfile

      - name: Run desktop tests
        working-directory: apps/desktop
        run: pnpm test

      - name: Run agent tests
        working-directory: ${{ env.AGENT_WORKSPACE }}
        run: cargo test --locked --manifest-path Cargo.toml

      - name: Build desktop app (electron-vite)
        working-directory: apps/desktop
        run: pnpm build

      - name: Package desktop app (electron-builder)
        working-directory: apps/desktop
        run: pnpm package

      - name: Assert packaging did not attempt a publish
        working-directory: apps/desktop
        shell: bash
        run: |
          set -e
          # The packaging script must never publish implicitly: on non-release
          # events electron-builder would fail with "GitHub Personal Access
          # Token is not set". Release publishing is owned by the `release` job.
          script=$(node -p "require('./package.json').scripts.package")
          echo "package script: $script"
          case "$script" in
            *"--publish never"*) echo "OK: implicit publish disabled." ;;
            *) echo "::error::apps/desktop package script must pass --publish never"; exit 1 ;;
          esac

      - name: Upload artifact — Linux .deb
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: ponter-desktop-linux-deb
          path: apps/desktop/dist/*.deb
          if-no-files-found: error
          retention-days: 7

      - name: Upload artifact — Linux .rpm
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: ponter-desktop-linux-rpm
          path: apps/desktop/dist/*.rpm
          if-no-files-found: error
          retention-days: 7

      - name: Upload artifact — Linux .AppImage
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: ponter-desktop-linux-appimage
          path: apps/desktop/dist/*.AppImage
          if-no-files-found: error
          retention-days: 7

      - name: Upload artifact — Linux update metadata
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: ponter-desktop-linux-update-metadata
          path: apps/desktop/dist/latest*.yml
          if-no-files-found: warn
          retention-days: 7

      - name: Upload artifact — Windows NSIS installer
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: ponter-desktop-windows-nsis
          path: apps/desktop/dist/*Setup*.exe
          if-no-files-found: error
          retention-days: 7

      - name: Upload artifact — Windows portable
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: ponter-desktop-windows-portable
          path: apps/desktop/dist/*Portable*.exe
          if-no-files-found: error
          retention-days: 7

      - name: Upload artifact — Windows update metadata
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: ponter-desktop-windows-update-metadata
          path: apps/desktop/dist/latest*.yml
          if-no-files-found: warn
          retention-days: 7

      - name: Assert installer artifacts (Linux)
        if: matrix.os == 'ubuntu-latest'
        working-directory: apps/desktop
        run: |
          set -e
          echo "dist/ contents:"
          ls -la dist/
          find dist -maxdepth 1 -name '*.deb' | grep -q . || { echo "::error::No .deb found"; exit 1; }
          find dist -maxdepth 1 -name '*.rpm' | grep -q . || { echo "::error::No .rpm found"; exit 1; }
          find dist -maxdepth 1 -name '*.AppImage' | grep -q . || { echo "::error::No .AppImage found"; exit 1; }
          for f in dist/*.deb dist/*.rpm dist/*.AppImage; do
            sz=$(wc -c < "$f")
            echo "  $f ($sz bytes)"
            if [ "$sz" -lt 10240 ]; then
              echo "::error::File $f is smaller than 10 KB ($sz bytes)"
              exit 1
            fi
          done
          echo "Installer artifact check PASSED (Linux)."

      - name: Assert installer artifacts (Windows)
        if: matrix.os == 'windows-latest'
        working-directory: apps/desktop
        shell: pwsh
        run: |
          Write-Host "dist/ contents:"
          Get-ChildItem -Recurse -File dist | Format-Table FullName, Length
          $nsis = Get-ChildItem -File dist -Filter '*Setup*.exe' | Where-Object { $_.Length -ge 10240 }
          $portable = Get-ChildItem -File dist -Filter '*Portable*.exe' | Where-Object { $_.Length -ge 10240 }
          if (-not $nsis) { throw "No NSIS installer (.exe matching *Setup*) found in dist/" }
          if (-not $portable) { throw "No portable build (.exe matching *Portable*) found in dist/" }
          Write-Host "Installer artifact check PASSED (Windows): NSIS + portable present."

  # ---------------------------------------------------------------------------
  # Publish a GitHub Release with all platform installer artifacts.
  # Runs only on tag push or a non-dry-run manual dispatch.
  # ---------------------------------------------------------------------------
  release:
    name: Create GitHub Release
    needs: build
    if: |
      startsWith(github.ref, 'refs/tags/') ||
      (github.event_name == 'workflow_dispatch' && inputs.dry_run == false)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'

      - name: Download all build artifacts
        uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806 # v4.1.9
        with:
          path: dist
          merge-multiple: true

      - name: Assert release installer assets exist
        shell: bash
        run: |
          set -e
          echo "Installer files present under dist/:"
          find dist -type f \( -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' \
            -o -name '*.msi' -o -name '*.exe' \) -print || true
          count=$(find dist -type f \( -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' \
            -o -name '*.msi' -o -name '*.exe' \) | wc -l)
          echo "Installer files found: $count"
          if [ "$count" -lt 1 ]; then
            echo "::error::No installer files found under dist/ — the release would be empty"
            exit 1
          fi

      - name: Set version and prerelease flag
        id: meta
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
          PRERELEASE_INPUT: ${{ inputs.prerelease }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            raw="$INPUT_VERSION"
          else
            raw="$REF_NAME"
          fi
          version="${raw#v}"
          version="${version#desktop-v}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

          IS_PRERELEASE="false"
          if [[ "${raw}" == *-* ]] || [ -n "${PRERELEASE_INPUT}" ]; then
            IS_PRERELEASE="true"
          fi
          echo "prerelease=${IS_PRERELEASE}" >> "$GITHUB_OUTPUT"

      - name: Generate consolidated checksums manifest
        shell: bash
        run: |
          cd dist
          find . -type f \( -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' \
            -o -name '*.msi' -o -name '*.exe' \) -exec sh -c 'sha256sum "$1"' _ {} \; > SHA256SUMS.txt
          echo "Consolidated checksums:"
          cat SHA256SUMS.txt
          echo "Release assets:"
          find . -type f | sort

      - name: Create GitHub Release
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda # v2.2.1
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', steps.meta.outputs.version) }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('Ponter Desktop v{0}', steps.meta.outputs.version) }}
          files: |
            dist/**/*.deb
            dist/**/*.rpm
            dist/**/*.AppImage
            dist/**/*.msi
            dist/**/*.exe
            dist/**/latest*.yml
            dist/SHA256SUMS.txt
          prerelease: ${{ steps.meta.outputs.prerelease == 'true' }}
          generate_release_notes: true
