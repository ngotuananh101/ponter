name: Build Agent

# Cross-platform release + verification workflow for the `ponter-agent` Rust
# binary at `apps/agent` (spec: Cross-Platform Build Workflow Design).
#
# - Tag push (v*.*.* / agent-v*.*.*): builds all targets, publishes a GitHub
#   Release with assets and SHA256 checksums attached.
# - workflow_dispatch: identical, plus `dry_run` to build without releasing.
# - Pull requests and branch pushes to main/develop: runs the verify gate and
#   a build-and-check; no release is created.
# - Path filter: `apps/agent/**` and this workflow file so dependency bumps
#   elsewhere don't trigger a cross-platform matrix.

on:
  push:
    tags:
      - 'v*.*.*'
      - 'agent-v*.*.*'
    branches:
      - main
      - develop
    paths:
      - 'apps/agent/**'
      - '.github/workflows/build-agent.yml'
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'apps/agent/**'
      - '.github/workflows/build-agent.yml'
  workflow_dispatch:
    inputs:
      version:
        description: 'Semantic version to release (e.g. 0.1.0)'
        required: true
        type: string
      prerelease:
        description: 'Optional prerelease suffix (e.g. beta.1); leave empty for a stable release'
        type: string
        default: ''
      dry_run:
        description: 'Build and package but skip the GitHub Release (for testing the workflow)'
        type: boolean
        default: false

# One in-flight run per ref so a re-triggered release cancels the prior one
# rather than racing on the same tag.
concurrency:
  group: build-agent-${{ github.ref }}
  cancel-in-progress: true

env:
  WORKSPACE: apps/agent

jobs:
  # ---------------------------------------------------------------------------
  # Verify gate: run on PRs and branch pushes (not tags / manual dispatch).
  # Re-uses the existing ci.yml convention — fmt, clippy, tests, build.
  # ---------------------------------------------------------------------------
  verify:
    name: Verify
    if: github.event_name != 'workflow_dispatch' && !startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.WORKSPACE }}
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: '1.98.1'
          components: rustfmt, clippy

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: ${{ env.WORKSPACE }} -> ${{ env.WORKSPACE }}/target

      - name: Check formatting
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Run tests
        run: cargo test --locked

      - name: Build (host target, verify mode)
        run: cargo build --release --locked

  # ---------------------------------------------------------------------------
  # Cross-platform build + package matrix (6 targets).
  # Runs on every trigger; on PRs/branch pushes the artifact upload is skipped.
  # ---------------------------------------------------------------------------
  build:
    name: ${{ matrix.os }}/${{ matrix.arch }}
    needs: verify
    if: ${{ always() && (needs.verify.result == 'success' || needs.verify.result == 'skipped') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-gnu
          - x86_64-apple-darwin
          - aarch64-apple-darwin
          - x86_64-pc-windows-msvc
        include:
          - target: x86_64-unknown-linux-gnu
            os: Linux
            arch: x64-gnu
            runner: ubuntu-latest
            pkg_ext: tar.gz
            bin_name: ponter-agent
          - target: x86_64-unknown-linux-musl
            os: Linux
            arch: x64-musl
            runner: ubuntu-latest
            pkg_ext: tar.gz
            bin_name: ponter-agent
            static: true
          - target: aarch64-unknown-linux-gnu
            os: Linux
            arch: arm64-gnu
            runner: ubuntu-24.04-arm
            pkg_ext: tar.gz
            bin_name: ponter-agent
          - target: x86_64-apple-darwin
            os: macOS
            arch: x64
            runner: macos-14
            pkg_ext: tar.gz
            bin_name: ponter-agent
          - target: aarch64-apple-darwin
            os: macOS
            arch: arm64
            runner: macos-14
            pkg_ext: tar.gz
            bin_name: ponter-agent
          - target: x86_64-pc-windows-msvc
            os: Windows
            arch: x64-msvc
            runner: windows-latest
            pkg_ext: zip
            bin_name: ponter-agent.exe
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: '1.98.1'

      # Per-target caching isolates platform-specific artifacts
      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: ${{ env.WORKSPACE }} -> ${{ env.WORKSPACE }}/target/${{ matrix.target }}
          key: ${{ runner.os }}-${{ matrix.target }}-${{ hashFiles('apps/agent/Cargo.lock') }}

      # musl needs the C toolchain to link the fully static binary.
      - name: Install musl tools (musl target only)
        if: ${{ matrix.target == 'x86_64-unknown-linux-musl' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Add Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Set static link flags (musl only)
        if: ${{ matrix.target == 'x86_64-unknown-linux-musl' }}
        run: echo "RUSTFLAGS=-C target-feature=+crt-static" >> "$GITHUB_ENV"

      # Build stripped release binary (--locked respects Cargo.lock)
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} --manifest-path ${{ env.WORKSPACE }}/Cargo.toml

      - name: Determine version
        id: version
        if: ${{ startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' }}
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ -n "$INPUT_VERSION" ]; then
            raw="$INPUT_VERSION"
          elif [ "${REF_NAME#v}" != "$REF_NAME" ] || [ "${REF_NAME#agent-v}" != "$REF_NAME" ]; then
            raw="$REF_NAME"
          else
            cargo_ver=$(grep -m1 '^version = ' "${WORKSPACE}/Cargo.toml" | cut -d '"' -f2)
            short_sha="${SHA:0:7}"
            raw="${cargo_ver:-0.1.0}-${short_sha}"
          fi
          # Strip leading 'v' or 'agent-v'
          version="${raw#v}"
          version="${version#agent-v}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: 'Package (Unix: tar.gz)'
        if: ${{ matrix.pkg_ext == 'tar.gz' && (startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main') }}
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TARGET: ${{ matrix.target }}
          BIN: ${{ matrix.bin_name }}
        run: |
          ARTIFACT="ponter-agent-v${VERSION}-${TARGET}"
          tar -czf "${ARTIFACT}.tar.gz" \
            -C "${WORKSPACE}/target/${TARGET}/release" \
            "${BIN}"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${ARTIFACT}.tar.gz" > "${ARTIFACT}.tar.gz.sha256"
          else
            shasum -a 256 "${ARTIFACT}.tar.gz" > "${ARTIFACT}.tar.gz.sha256"
          fi

      - name: 'Package (Windows: zip)'
        if: ${{ matrix.pkg_ext == 'zip' && (startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main') }}
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TARGET: ${{ matrix.target }}
        run: |
          $DEST = "ponter-agent-v$env:VERSION-$env:TARGET.zip"
          $SOURCE = "$env:WORKSPACE/target/$env:TARGET/release/ponter-agent.exe"
          Compress-Archive -Path $SOURCE -DestinationPath $DEST -Force
          $HASH = (Get-FileHash -Path $DEST -Algorithm SHA256).Hash.ToLower()
          "$HASH  $DEST" | Out-File -FilePath "$DEST.sha256" -Encoding ascii

      # Upload build artifacts on tags, manual dispatch, and pushes to main.
      - name: Upload build artifact
        if: ${{ startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' }}
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: ponter-agent-${{ matrix.target }}
          path: |
            ponter-agent-v*.tar.gz
            ponter-agent-v*.zip
            ponter-agent-v*.sha256
          if-no-files-found: error
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Publish a GitHub Release with all platform artifacts attached.
  # Runs only on tag push or a non-dry-run manual dispatch.
  # ---------------------------------------------------------------------------
  release:
    name: Create GitHub Release
    needs: build
    if: |
      startsWith(github.ref, 'refs/tags/') ||
      (github.event_name == 'workflow_dispatch' && inputs.dry_run == false)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Download all build artifacts
        uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806 # v4.1.9
        with:
          path: dist
          merge-multiple: true

      - name: Generate consolidated checksums manifest
        shell: bash
        run: |
          cd dist
          cat *.sha256 > SHA256SUMS.txt
          echo "Consolidated checksums:"
          cat SHA256SUMS.txt

      - name: Set version and prerelease flag
        id: meta
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
          PRERELEASE_INPUT: ${{ inputs.prerelease }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            raw="$INPUT_VERSION"
          else
            raw="$REF_NAME"
          fi
          version="${raw#v}"
          version="${version#agent-v}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

          # A tag containing a hyphen (v0.1.0-beta.1) or an explicit
          # prerelease input marks the release as prerelease.
          IS_PRERELEASE="false"
          if [[ "${raw}" == *-* ]] || [ -n "${PRERELEASE_INPUT}" ]; then
            IS_PRERELEASE="true"
          fi
          echo "prerelease=${IS_PRERELEASE}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda # v2.2.1
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', steps.meta.outputs.version) }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('ponter-agent v{0}', steps.meta.outputs.version) }}
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
            dist/SHA256SUMS.txt
          prerelease: ${{ steps.meta.outputs.prerelease == 'true' }}
          generate_release_notes: true
