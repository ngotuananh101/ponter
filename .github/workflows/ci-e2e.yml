name: CI (E2E)

# Cross-language E2E suite: a real Rust agent binary + the @ponter/server
# backend + the TypeScript offerer talking over a real DTLS/SCTP connection.
# Split out of the old monolithic `ci.yml` so it only runs when one of its
# inputs changes (the agent it spawns, the server it talks to, or webrtc-core).
#
# The suite is Linux-only (`describe.skipIf(!isLinux)`), hence ubuntu-latest.

on:
  push:
    branches: [main, develop]
    paths:
      - 'packages/webrtc-core/**'
      - 'packages/shared/**'
      - 'apps/agent/**'
      - 'apps/server/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/ci-e2e.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'packages/webrtc-core/**'
      - 'packages/shared/**'
      - 'apps/agent/**'
      - 'apps/server/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/ci-e2e.yml'

jobs:
  e2e:
    name: Cross-language terminal E2E
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.6.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: '1.98.1'

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: apps/agent -> apps/agent/target

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install system dependencies (capture stack + Xvfb)
        run: sudo apt-get update && sudo apt-get install -y pkg-config libclang-dev libxcb1-dev libxrandr-dev libpipewire-0.3-dev libspa-0.2-dev libwayland-dev libegl-dev libgbm-dev libdrm-dev xvfb xdotool

      - name: Start Xvfb
        run: |
          Xvfb :99 -screen 0 1920x1080x24 &
          echo "DISPLAY=:99" >> "$GITHUB_ENV"

      # Build the agent binary that the E2E harness spawns.
      - name: Build the agent binary
        run: cargo build --locked
        working-directory: apps/agent

      - name: Run the E2E suite
        run: pnpm --filter @ponter/webrtc-core test:e2e
