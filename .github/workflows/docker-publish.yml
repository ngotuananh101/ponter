name: Docker Publish

# Build the @ponter/server image once in CI and push it to Docker Hub, so a
# deployment host never has to build from source. Compose files in docker/
# reference `<tên Docker Hub của bạn>/ponter:latest`; the only thing left to do on the
# host is `docker compose pull && docker compose up -d`.
#
# Manual trigger by design: this is a deploy-affecting action (it moves the
# `latest` tag that production compose files point at), so it runs when a
# human asks for it rather than on every push to main.
#
# Multi-arch via two NATIVE runners, not QEMU. better-sqlite3@11.10.0 has no
# prebuilt binary for Node 24 (ABI 137) — its prebuilds stop at ABI 131 — so
# `pnpm install` always falls back to `node-gyp rebuild` and compiles SQLite
# from source. Under QEMU emulation that single compile dominates the build;
# native runners make it roughly as fast as a local build.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Optional extra tag to attach to the published manifest (e.g. v1.2.3); empty = latest/sha only'
        required: false
        default: ''
        type: string

# One publish at a time. cancel-in-progress is false so a queued second run
# cannot truncate the manifest that a running one is assembling.
concurrency:
  group: docker-publish
  cancel-in-progress: false

permissions:
  contents: read

env:
  # The image name is derived from the Docker Hub username secret rather than
  # hardcoded, because the Docker Hub account is not the same identifier as the
  # GitHub one. The repository name stays fixed; only the namespace follows the
  # credential. Override the repo half with a DOCKERHUB_REPOSITORY variable if
  # it ever needs to differ from `ponter`.
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/${{ vars.DOCKERHUB_REPOSITORY || 'ponter' }}
  DEPLOY_BE_WEBHOOK: ${{ secrets.DEPLOY_BE_WEBHOOK || vars.DEPLOY_BE_WEBHOOK }}

jobs:
  validate:
    name: Validate tag input
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate tag input
        if: ${{ inputs.tag != '' }}
        shell: bash
        env:
          TAG_INPUT: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [[ ! "$TAG_INPUT" =~ ^[a-zA-Z0-9_][a-zA-Z0-9._-]{0,127}$ ]]; then
            echo "::error::invalid tag '${TAG_INPUT}' — must match ^[a-zA-Z0-9_][a-zA-Z0-9._-]{0,127}$"
            exit 1
          fi
          if [[ "$TAG_INPUT" == "latest" && "$REF_NAME" != "refs/heads/main" ]]; then
            echo "::error::refusing 'latest' from '${REF_NAME}' — only refs/heads/main may move the production tag"
            exit 1
          fi
          echo "Tag input '${TAG_INPUT}' is valid."

  build:
    name: Build ${{ matrix.platform }}
    needs: validate
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            artifact: image-linux-amd64
          - platform: linux/arm64
            # Native ARM runner. The repo is public, so this is not billed.
            # build-agent.yml already uses this label for the Rust aarch64 build.
            runner: ubuntu-24.04-arm
            artifact: image-linux-arm64
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          # Tags are not requested here: a push-by-digest build cannot carry a
          # tagged ref, so the merge job is what applies them. Only the OCI
          # labels are needed, and they must be present on the per-platform
          # images that make up the final manifest. Kept in sync with the
          # labels block in the merge job.
          labels: |
            org.opencontainers.image.title=ponter-server
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile.server
          platforms: ${{ matrix.platform }}
          # Push to a digest-addressed ref, NOT to the final tags. Both matrix
          # jobs run concurrently; pushing the same tag from two jobs is a race
          # in which the last one to finish overwrites the other's manifest.
          # The merge job below combines these digests into the tagged manifest.
          #
          # `tags:` is deliberately NOT passed here. push-by-digest and a tagged
          # ref are mutually exclusive -- buildx rejects the combination with
          # "can't push tagged ref ... by digest". The tag names are computed
          # by metadata-action and applied in the merge job instead; only the
          # OCI labels travel with the per-platform build.
          outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}

      - name: Export digest
        shell: bash
        run: |
          mkdir -p /tmp/digest
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digest/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: ${{ matrix.artifact }}
          path: /tmp/digest/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Merge multi-arch manifest
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Download digests
        uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806 # v4.1.9
        with:
          path: /tmp/digests
          pattern: image-linux-*
          merge-multiple: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          # This is the only place tags are defined. The per-platform builds
          # push by digest and cannot carry a tagged ref; this job attaches the
          # names to the merged manifest.
          #
          # `type=raw,value=latest` is required, not decorative. metadata-action
          # only auto-generates `latest` for tag/semver/pep440/match events; a
          # workflow_dispatch run carries a branch ref, so without this line the
          # only tag produced would be `main` and every compose file pointing at
          # :latest would fail to pull.
          #
          # The enable guard keeps an experimental branch from moving the tag
          # that production resolves; it still gets its own sha tag.
          #
          # type=sha defaults to a 7-character short sha; stated explicitly so
          # the rollback tag stays what people expect if the default ever moves.
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}
            type=sha,format=short

      - name: Create and push manifest list
        shell: bash
        run: |
          set -euo pipefail

          # Re-derive the tags from metadata rather than parsing the build
          # job's output, so both jobs are guaranteed to agree on the names.
          mapfile -t tags < <(sed 's/,/\n/g' <<< '${{ steps.meta.outputs.tags }}' | sed '/^$/d')
          args=()
          for t in "${tags[@]}"; do
            args+=(--tag "${t}")
          done

          # Each digest file is named after its sha256 hex, one per matrix job.
          mapfile -t digests < <(find /tmp/digests -type f -printf '%f\n' | sort)
          if [ "${#digests[@]}" -ne 2 ]; then
            echo "expected 2 platform digests, found ${#digests[@]}" >&2
            exit 1
          fi
          sources=()
          for d in "${digests[@]}"; do
            sources+=("${IMAGE_NAME}@sha256:${d}")
          done

          docker buildx imagetools create "${args[@]}" "${sources[@]}"

          echo "Published tags: ${tags[*]}"
          docker buildx imagetools inspect "${tags[0]}"

      - name: Trigger deployment webhook
        if: ${{ env.DEPLOY_BE_WEBHOOK != '' }}
        shell: bash
        env:
          DEPLOY_BE_WEBHOOK: ${{ env.DEPLOY_BE_WEBHOOK }}
        run: |
          set -euo pipefail
          bash docker/trigger-webhook.sh "$DEPLOY_BE_WEBHOOK"

      - name: Prune old sha-* tags (keep 3 newest)
        if: ${{ inputs.tag == '' }}
        shell: bash
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          trap 'echo "::error::image published OK, but the prune step failed — check the DOCKERHUB_TOKEN Delete scope (and DOCKERHUB_USERNAME / DOCKERHUB_TOKEN credentials)"' ERR

          image="${IMAGE_NAME}"
          ns="${image%%/*}"
          repo="${image##*/}"

          # A fresh Hub API login: the registry token from docker/login-action
          # is scoped for pushes, not for the Hub API's tag management.
          payload="$(jq -nc --arg u "$DOCKERHUB_USERNAME" --arg p "$DOCKERHUB_TOKEN" '{username:$u,password:$p}')"
          if ! token="$(curl -fsS -X POST https://hub.docker.com/v2/users/login \
            -H 'Content-Type: application/json' -d "$payload" | jq -r '.token')" \
            || [[ -z "$token" || "$token" == "null" ]]; then
            echo "::error::Docker Hub API login failed — image published OK; check DOCKERHUB_USERNAME / DOCKERHUB_TOKEN"
            exit 1
          fi

          # Walk every page (the API paginates via `next`).
          all="$(mktemp)"
          page="https://hub.docker.com/v2/repositories/${ns}/${repo}/tags?page_size=100"
          while [[ -n "$page" && "$page" != "null" ]]; do
            body="$(curl -fsS -H "Authorization: Bearer ${token}" "$page")"
            jq -c '.results[]' <<<"$body" >> "$all"
            page="$(jq -r '.next // empty' <<<"$body")"
          done

          selected="$(mktemp)"
          bash docker/prune-tags.sh --keep 3 < "$all" > "$selected"
          mapfile -t to_delete < "$selected"
          rm -f "$all" "$selected"

          if [[ "${#to_delete[@]}" -eq 0 ]]; then
            echo "::notice::No sha-* tags to prune (3 or fewer present)."
            exit 0
          fi

          for tag in "${to_delete[@]}"; do
            echo "Deleting ${image}:${tag}"
            if ! curl -fsS -X DELETE \
              -H "Authorization: Bearer ${token}" \
              "https://hub.docker.com/v2/repositories/${ns}/${repo}/tags/${tag}/"; then
              echo "::error::image published OK, but pruning '${tag}' failed — check the DOCKERHUB_TOKEN Delete scope"
              exit 1
            fi
          done
          echo "::notice::Pruned ${#to_delete[@]} old sha-* tag(s): ${to_delete[*]}"
