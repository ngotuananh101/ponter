name: Docker Publish

# Build the @ponter/server image once in CI and push it to Docker Hub, so a
# deployment host never has to build from source. Compose files in docker/
# reference `ngotuananh101/ponter:latest`; the only thing left to do on the
# host is `docker compose pull && docker compose up -d`.
#
# Manual trigger by design: this is a deploy-affecting action (it moves the
# `latest` tag that production compose files point at), so it runs when a
# human asks for it rather than on every push to main.
#
# Multi-arch via two NATIVE runners, not QEMU. better-sqlite3@11.10.0 has no
# prebuilt binary for Node 24 (ABI 137) — its prebuilds stop at ABI 131 — so
# `pnpm install` always falls back to `node-gyp rebuild` and compiles SQLite
# from source. Under QEMU emulation that single compile dominates the build;
# native runners make it roughly as fast as a local build.

on:
  workflow_dispatch:

# One publish at a time. cancel-in-progress is false so a queued second run
# cannot truncate the manifest that a running one is assembling.
concurrency:
  group: docker-publish
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE_NAME: ngotuananh101/ponter

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            artifact: image-linux-amd64
          - platform: linux/arm64
            # Native ARM runner. The repo is public, so this is not billed.
            # build-agent.yml already uses this label for the Rust aarch64 build.
            runner: ubuntu-24.04-arm
            artifact: image-linux-arm64
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          # `type=raw,value=latest` is required, not decorative. metadata-action
          # only auto-generates `latest` for tag/semver/pep440/match events;
          # a workflow_dispatch run carries a branch ref, so without this line
          # the only tag produced would be `main` and every compose file
          # pointing at :latest would fail to pull.
          #
          # The enable guard keeps an experimental branch from moving the tag
          # that production resolves; it still gets its own sha tag.
          #
          # type=sha defaults to a 7-character short sha; stated explicitly so
          # the rollback tag stays what people expect if the default ever moves.
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=short
          labels: |
            org.opencontainers.image.title=ponter-server
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile.server
          platforms: ${{ matrix.platform }}
          # Push to a digest-addressed ref, NOT to the final tags. Both matrix
          # jobs run concurrently; pushing the same tag from two jobs is a race
          # in which the last one to finish overwrites the other's manifest.
          # The merge job below combines these digests into the tagged manifest.
          outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}

      - name: Export digest
        shell: bash
        run: |
          mkdir -p /tmp/digest
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digest/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: ${{ matrix.artifact }}
          path: /tmp/digest/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Merge multi-arch manifest
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download digests
        uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806 # v4.1.9
        with:
          path: /tmp/digests
          pattern: image-linux-*
          merge-multiple: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=short

      - name: Create and push manifest list
        shell: bash
        run: |
          set -euo pipefail

          # Re-derive the tags from metadata rather than parsing the build
          # job's output, so both jobs are guaranteed to agree on the names.
          mapfile -t tags < <(sed 's/,/\n/g' <<< '${{ steps.meta.outputs.tags }}' | sed '/^$/d')
          args=()
          for t in "${tags[@]}"; do
            args+=(--tag "${t}")
          done

          # Each digest file is named after its sha256 hex, one per matrix job.
          mapfile -t digests < <(find /tmp/digests -type f -printf '%f\n' | sort)
          if [ "${#digests[@]}" -ne 2 ]; then
            echo "expected 2 platform digests, found ${#digests[@]}" >&2
            exit 1
          fi
          sources=()
          for d in "${digests[@]}"; do
            sources+=("${IMAGE_NAME}@sha256:${d}")
          done

          docker buildx imagetools create "${args[@]}" "${sources[@]}"

          echo "Published tags: ${tags[*]}"
          docker buildx imagetools inspect "${tags[0]}"
