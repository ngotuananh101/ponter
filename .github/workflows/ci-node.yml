name: CI (Node)

# Node/TypeScript workspace verification: lint, typecheck, format, and the
# Node/TypeScript test suites.
#
# Split out of the old monolithic `ci.yml` so that a push only runs the work
# that its changes actually affect. The agent at `apps/agent` is deliberately
# EXCLUDED here by the turbo `--filter='!@ponter/agent-node'` below.
#
# Two reasons, and only the second is permanent:
#   1. `paths:` does not list `apps/agent/**`, so a branch that touches only the
#      agent never reaches this job anyway. The exclusion makes that explicit.
#   2. The directory holds BOTH the Rust crate — gated by `build-agent.yml` —
#      and the `@ponter/agent-node` TypeScript package, which is not gated yet.
#      When Plan 3 adds `apps/agent/**` to `paths:`, the filter is what keeps
#      the not-yet-gating package out of a job that runs on unrelated pushes.
#
# The filter names the agent's CURRENT package name. Turbo treats a filter that
# matches no package as a fatal error, not an empty selection, so renaming
# `apps/agent/package.json` without updating these filters aborts the whole
# workspace verify step — every Node push, not only an agent one. Keep all three
# in step with that manifest.

on:
  push:
    branches: [main, develop]
    paths:
      - 'apps/server/**'
      - 'apps/web/**'
      - 'apps/mobile/**'
      - 'packages/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'turbo.json'
      - 'tsconfig.base.json'
      - 'eslint.config.js'
      - '.prettierrc.json'
      - '.prettierignore'
      - '.github/workflows/ci-node.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'apps/server/**'
      - 'apps/web/**'
      - 'apps/mobile/**'
      - 'packages/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'turbo.json'
      - 'tsconfig.base.json'
      - 'eslint.config.js'
      - '.prettierrc.json'
      - '.prettierignore'
      - '.github/workflows/ci-node.yml'

jobs:
  verify:
    name: Lint, Typecheck, Format & Node Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.6.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `!@ponter/agent-node` excludes the agent's TS package: it is not gating
      # yet, and `apps/agent/**` is absent from `paths:` (see the header note).
      - name: Lint workspace
        run: pnpm exec turbo run lint --filter='!@ponter/agent-node'

      - name: Typecheck workspace
        run: pnpm exec turbo run typecheck --filter='!@ponter/agent-node'

      - name: Check code formatting
        run: pnpm format:check

      # Run every Node/TypeScript test suite through turbo, so the CI log and
      # exit code cover the whole workspace rather than a hand-picked few.
      #
      # `!@ponter/agent-node` drops the agent's TS package, which is not gating
      # yet (see the header note).
      # `!@ponter/web` and `!@ponter/shared` are excluded here only because
      # they are non-gating: their steps below keep the `continue-on-error:
      # true` behaviour they have always had, and turbo has no per-package
      # "allowed to fail" mode to express that. Running them a second time in
      # this gating step would be redundant.
      #
      # `--continue=always` matters: turbo's default is to cancel the remaining
      # tasks once one fails, which would hide a later suite's result behind an
      # earlier failure. Every suite must run and report.
      - name: Run Node test suites
        run: >-
          pnpm exec turbo run test
          --filter='!@ponter/agent-node'
          --filter='!@ponter/web'
          --filter='!@ponter/shared'
          --continue=always

      - name: Run web test suite
        run: pnpm --filter @ponter/web test
        continue-on-error: true # UI tests may be flaky

      - name: Run shared package tests
        run: pnpm --filter @ponter/shared test
        continue-on-error: true
