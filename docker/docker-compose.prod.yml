# Production VPS compose setup with Caddy reverse proxy and a native Coturn TURN server.
#
# Services:
#   - server   : @ponter/server, persistent SQLite on ./data.
#   - coturn   : STUN/TURN on host networking, RFC 5766 long-term auth with a
#                 shared secret so the server can mint time-limited credentials.
#   - caddy    : automatic HTTPS via Let's Encrypt, reverse proxy to `server`.
#
# Usage:
#   cd docker
#   cp .env.example .env
#   # edit .env with your real secrets and DOMAIN
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml up -d
#
# The server image is published by CI (see .github/workflows/docker-publish.yml)
# and pulled from Docker Hub — no local build required.
#
# Notes:
#   - coturn uses `network_mode: host` so it can bind the full 49152-49200 UDP
#     relay range without NAT/port-mapping complications.
#   - Caddy terminates TLS and proxies to the server on port 8787 (internal only).
#   - The server generates TURN credentials on demand via
#     `GET /api/webrtc/ice-servers` using TURN_SECRET + TURN_URL + STUN_URL.
services:
  server:
    image: ${DOCKERHUB_IMAGE:-ngotuananh2101/ponter}:latest
    container_name: ponter-server-prod
    restart: always
    # Docker's default is 10s, then SIGKILL — too short for the server's
    # graceful shutdown (close every signaling socket with 1001, then drain
    # `server.close`). 15s covers that with headroom; a redeploy stops looking
    # like a network drop to every connected browser and agent.
    stop_grace_period: 15s
    environment:
      - PORT=8787
      - DATABASE_PATH=/app/data/remote.db
      - JWT_SECRET=${JWT_SECRET}
      - REFRESH_TOKEN_SECRET=${REFRESH_TOKEN_SECRET}
      - CORS_ORIGIN=https://${DOMAIN}
      - TURN_SECRET=${TURN_SECRET}
      # TURN_URL/STUN_URL are overridable from .env (e.g. a raw IP when DNS is
      # not resolvable from every client network); they fall back to the domain.
      - TURN_URL=${TURN_URL:-turn:${DOMAIN}:3478}
      - STUN_URL=${STUN_URL:-stun:${DOMAIN}:3478}
      - TURN_PROVIDER=${TURN_PROVIDER:-coturn}
      - TURN_KEY_ID=${TURN_KEY_ID:-}
      - TURN_KEY_API_TOKEN=${TURN_KEY_API_TOKEN:-}
    volumes:
      - ./data:/app/data

  coturn:
    # network_mode: host is required so TURN can bind the UDP relay port range
    # (49152-49200) and advertise the host IP. Residual risk: the container shares
    # the host network namespace. Mitigation: coturn runs unprivileged with a
    # static auth secret and no shell; ports are firewalled to the TURN range only.
    image: coturn/coturn:4.6.3@sha256:71c3c990283385567f11794ee692e3a47b66fd9b0bb39e42afbe776e331dd888
    container_name: coturn
    restart: always
    network_mode: host
    command:
      - '-n'
      - '--log-file=stdout'
      - '--lt-cred-mech'
      - '--use-auth-secret'
      - '--static-auth-secret=${TURN_SECRET}'
      - '--realm=${DOMAIN}'
      - '--min-port=49152'
      - '--max-port=49200'

  caddy:
    image: caddy:2-alpine
    container_name: caddy
    restart: always
    environment:
      - DOMAIN=${DOMAIN}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - ./caddy_data:/data
      - ./caddy_config:/config
    depends_on:
      - server
