# Local development compose setup.
#
# Spins up the @ponter/server container with an ephemeral SQLite database
# (bind-mounted to ./data) and the Google public STUN server as the only ICE
# candidate. No TURN relay, no reverse proxy — ideal for LAN testing.
#
# Usage:
#   cd docker
#   docker compose -f docker-compose.local.yml up --build
#
# This file deliberately keeps `build:` while the tunnel/prod/nginx files pull
# `ngotuananh101/ponter:latest` from Docker Hub. Local development must reflect
# uncommitted edits to apps/server — pulling a published image would silently run
# stale code instead. The deployment compose files are the ones that avoid the
# build step.
#
services:
  server:
    build:
      context: ..
      dockerfile: docker/Dockerfile.server
    image: ponter-server:local
    container_name: ponter-server-local
    ports:
      - '8787:8787'
    environment:
      - PORT=8787
      - DATABASE_PATH=/app/data/remote.db
      - JWT_SECRET=local-dev-jwt-secret-key-32-chars-min
      - REFRESH_TOKEN_SECRET=local-dev-refresh-secret-key-32-chars
      - CORS_ORIGIN=*
    volumes:
      - ./data:/app/data
