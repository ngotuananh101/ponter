# Homelab / self-host compose setup with Cloudflare Tunnel.
#
# Runs the @ponter/server container with a bind-mounted SQLite volume and exposes
# it to the public internet via a Cloudflare Tunnel. A single TUNNEL_TOKEN
# (created with `cloudflared tunnel create`) is the only external secret.
#
# Usage:
#   cd docker
#   cp .env.example .env
#   # edit .env with your JWT_SECRET, TUNNEL_TOKEN, etc.
#   docker compose -f docker-compose.tunnel.yml pull
#   docker compose -f docker-compose.tunnel.yml up -d
#
# The server image is published by CI (see .github/workflows/docker-publish.yml)
# and pulled from Docker Hub — no local build required.
#
# Prerequisites:
#   - A Cloudflare Tunnel created with `cloudflared tunnel create <name>`
#     Run `cloudflared tunnel token <name>` to retrieve the token.
#   - DNS record pointing your domain to the tunnel.
services:
  server:
    image: ${DOCKERHUB_IMAGE:-ngotuananh2101/ponter}:latest
    container_name: ponter-server-tunnel
    restart: unless-stopped
    # Docker's default is 10s, then SIGKILL — too short for the server's
    # graceful shutdown (close every signaling socket with 1001, then drain
    # `server.close`). 15s covers that with headroom; a redeploy stops looking
    # like a network drop to every connected browser and agent.
    stop_grace_period: 15s
    environment:
      - PORT=8787
      - DATABASE_PATH=/app/data/remote.db
      - JWT_SECRET=${JWT_SECRET}
      - REFRESH_TOKEN_SECRET=${REFRESH_TOKEN_SECRET}
      - CORS_ORIGIN=${CORS_ORIGIN:?CORS_ORIGIN must be set to an explicit allowlist}
    volumes:
      - ./data:/app/data

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    restart: unless-stopped
    # `--config` is required for `originRequest` to apply: the token-only form
    # (`tunnel run` with TUNNEL_TOKEN) ignores per-service options, so the
    # WebSocket idle timeout would stay at Cloudflare's default and a browser
    # signaling socket would be dropped mid-session. `maxIdleDuration: 300s`
    # lives in ./cloudflared/config.yml (it has no env-var equivalent).
    command: tunnel --config /etc/cloudflared/config.yml run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    volumes:
      - ./cloudflared:/etc/cloudflared:ro
    depends_on:
      - server
