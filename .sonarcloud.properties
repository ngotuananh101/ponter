# SonarQube Cloud — Automatic Analysis configuration.
# Read from the repository's DEFAULT BRANCH only (main), not from feature branches.
#
# The shadcn-vue components are generated, byte-identical to the `reka-vega`
# registry (see .prettierignore). They are vendored third-party code, not
# hand-written project source, so they are excluded from analysis and from
# copy-paste (duplication) detection.
#
# The single shared tree lives at packages/ui-components/src/components/ui/.
# The two per-app paths are kept as harmless legacy entries (in case the
# consolidation is ever reverted). Note this file is read from the DEFAULT
# BRANCH only, so the shared path must be listed here on `main` for Sonar to
# exclude it when analyzing a feature branch/PR.
sonar.exclusions=apps/web/src/components/ui/**,apps/desktop/src/components/ui/**,packages/ui-components/src/components/ui/**
sonar.cpd.exclusions=apps/web/src/components/ui/**,apps/desktop/src/components/ui/**,packages/ui-components/src/components/ui/**
