# SonarQube Cloud — Automatic Analysis configuration.
# Read from the repository's DEFAULT BRANCH only (main), not from feature branches.
#
# The shadcn-vue components under apps/*/src/components/ui/ are generated,
# byte-identical to the `reka-vega` registry (see .prettierignore). They are
# vendored third-party code, not hand-written project source, so they are
# excluded from analysis and from copy-paste (duplication) detection.
sonar.exclusions=apps/web/src/components/ui/**,apps/desktop/src/components/ui/**
sonar.cpd.exclusions=apps/web/src/components/ui/**,apps/desktop/src/components/ui/**
